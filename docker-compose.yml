services:
  db:
    image: postgres:16-alpine
    container_name: watchly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-watchly}
    # Loopback only: for running the API on the host. Never publish it on
    # 0.0.0.0, Docker's port publishing bypasses ufw/firewalld.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - watchly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-watchly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI + the monitoring scheduler. Runs migrations on every start
  # (idempotent).
  api:
    build: .
    container_name: watchly-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network Postgres is "db" on its container port,
      # whatever .env says for running the API on the host.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ALERT_DASHBOARD_URL: ${ALERT_DASHBOARD_URL:-http://localhost:${WEB_PORT:-8080}}
      # The one address whose X-Forwarded-For uvicorn believes: the web
      # container's, pinned below. Never a whole subnet: that includes the
      # bridge gateway, which is what a client of the published port looks like
      # on Docker Desktop or through userland-proxy, and it could then forge
      # its own address to dodge the rate limits.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-${WEB_IP:-172.29.88.10}}
    # Loopback only, for /docs and curl from the host. Caddy reaches the API
    # over the Compose network, so nothing needs this port from outside, and
    # going around Caddy would skip its headers (see COUNTRY_HEADER). Never
    # publish it on 0.0.0.0, Docker's port publishing bypasses ufw/firewalld.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # Per-module log files (auth.log, errors.log, ...), readable from the host.
    volumes:
      - ./logs:/srv/watchly/logs
    # Ping checks use unprivileged ICMP sockets, which Linux allows only to the
    # groups in this range. Recent Docker opens it by default; say so anyway.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    depends_on:
      db:
        condition: service_healthy

  # The React app, served by Caddy, which also proxies /api to the api service.
  web:
    build: ./frontend
    container_name: watchly-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      # Caddy deletes this header from every request whose direct peer is not
      # in COUNTRY_TRUSTED_PROXIES (space-separated addresses or CIDRs: the
      # load balancer or CDN that sets the header). The default trusts no one
      # outside the container, so the header is always stripped, which is right
      # when nothing in front of Watchly sets it.
      COUNTRY_HEADER: ${COUNTRY_HEADER:-x-client-country}
      COUNTRY_TRUSTED_PROXIES: ${COUNTRY_TRUSTED_PROXIES:-127.0.0.1/32}
    # A fixed address, so the api can trust exactly this container's
    # X-Forwarded-For (FORWARDED_ALLOW_IPS above).
    networks:
      default:
        ipv4_address: ${WEB_IP:-172.29.88.10}
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        # Change WEB_SUBNET and WEB_IP together if this overlaps a network you use.
        - subnet: ${WEB_SUBNET:-172.29.88.0/24}

volumes:
  watchly_pgdata:
