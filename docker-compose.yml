services:
  db:
    image: postgres:16-alpine
    container_name: watchly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-watchly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - watchly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-watchly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI + the monitoring scheduler. Runs migrations and seeds the admin on
  # every start (both idempotent).
  api:
    build: .
    container_name: watchly-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network Postgres is "db" on its container port,
      # whatever .env says for running the API on the host.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ALERT_DASHBOARD_URL: ${ALERT_DASHBOARD_URL:-http://localhost:${WEB_PORT:-8080}}
    ports:
      - "${API_PORT:-8000}:8000"
    # Ping checks use unprivileged ICMP sockets, which Linux allows only to the
    # groups in this range. Recent Docker opens it by default; say so anyway.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    depends_on:
      db:
        condition: service_healthy

  # The React app, served by nginx, which also proxies /api to the api service.
  web:
    build: ./frontend
    container_name: watchly-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  watchly_pgdata:
