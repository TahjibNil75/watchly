name: Bug report
description: Something in Watchly doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Found a security problem?**
        Please don't use this form: see the
        [security policy](https://github.com/TahjibNil75/watchly/security/policy).

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include any error message you saw.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an HTTP check for https://example.com/
        2. Start maintenance for 30 minutes
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Watchly version
      description: "`curl http://localhost:8000/health` shows it."
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: How do you run Watchly?
      options:
        - Docker Compose
        - From source
        - Other (say below)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        The relevant lines from `docker compose logs api`. Remove passwords,
        tokens and email addresses first.
      render: shell
