server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Look "api" up through Docker's DNS at request time. A literal hostname in
    # proxy_pass is resolved once at startup, so recreating the api container
    # (which can change its IP) would leave nginx answering 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # "Check now" waits for the probe, and a site's timeout can be 120s.
        proxy_read_timeout 150s;
    }

    location = /health {
        proxy_pass $api;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes such as /websites/3 all load the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
