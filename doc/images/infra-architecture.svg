<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="900" role="img" aria-labelledby="t d">
  <title id="t">How Watchly monitors AWS infrastructure</title>
  <desc id="d">Watchly runs on an EC2 instance inside your VPC. It probes load balancers, Auto Scaling groups, EC2 servers and RDS databases over the private network, reads their state from the AWS APIs with a read-only IAM role, and sends alerts to email, Slack, Telegram, WhatsApp and webhooks.</desc>
  <defs>
    <marker id="probe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1c8f4e"/>
    </marker>
    <marker id="api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a5bd9"/>
    </marker>
    <marker id="alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c2410c"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1d23; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 12px; fill: #5b6270; }
    .l { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: #3a5bd9; }
    .box { fill: #fff; stroke: #d5d9e0; stroke-width: 1.2; }
  </style>

  <rect width="960" height="470" rx="14" fill="#f5f6f8"/>

  <!-- VPC -->
  <rect x="250" y="40" width="690" height="330" rx="14" fill="#eef1fb" stroke="#3a5bd9" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="268" y="64" class="l">YOUR VPC</text>

  <!-- Watchly -->
  <rect x="270" y="150" width="190" height="130" rx="12" fill="#fff" stroke="#1c8f4e" stroke-width="2"/>
  <circle cx="302" cy="190" r="14" fill="#1c8f4e"/>
  <circle cx="297" cy="186" r="4.5" fill="#fff"/><circle cx="308" cy="186" r="4.5" fill="#fff"/>
  <circle cx="297" cy="186" r="2" fill="#111418"/><circle cx="308" cy="186" r="2" fill="#111418"/>
  <text x="326" y="195" class="h">Watchly</text>
  <text x="286" y="226" class="s">on an EC2 instance</text>
  <text x="286" y="244" class="s">inside the VPC, with an</text>
  <text x="286" y="262" class="s">instance role</text>

  <!-- Targets -->
  <g>
    <rect class="box" x="620" y="76" width="300" height="60" rx="10"/>
    <text x="638" y="100" class="h">Load balancers</text>
    <text x="638" y="120" class="s">ALB / NLB · listener, /health, target health</text>

    <rect class="box" x="620" y="150" width="300" height="60" rx="10"/>
    <text x="638" y="174" class="h">Auto Scaling groups</text>
    <text x="638" y="194" class="s">every instance in service · group capacity</text>

    <rect class="box" x="620" y="224" width="300" height="60" rx="10"/>
    <text x="638" y="248" class="h">EC2 servers</text>
    <text x="638" y="268" class="s">ping · TCP port · HTTP, private or public IP</text>

    <rect class="box" x="620" y="298" width="300" height="60" rx="10"/>
    <text x="638" y="322" class="h">RDS databases</text>
    <text x="638" y="342" class="s">port · RDS status · CloudWatch · no login</text>
  </g>

  <!-- Probes: Watchly -> targets -->
  <g stroke="#1c8f4e" stroke-width="2" fill="none" marker-end="url(#probe)">
    <path d="M460 190 C540 190 540 106 616 106"/>
    <path d="M460 205 C540 205 540 180 616 180"/>
    <path d="M460 225 C540 225 540 254 616 254"/>
    <path d="M460 240 C540 240 540 328 616 328"/>
  </g>

  <!-- Watchly -> AWS APIs -->
  <path d="M365 280 L365 396" stroke="#3a5bd9" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#api)"/>
  <rect class="box" x="250" y="398" width="420" height="56" rx="10"/>
  <text x="268" y="422" class="h">AWS APIs · read-only IAM role</text>
  <text x="268" y="441" class="s">EC2 · ELB · Auto Scaling · RDS · CloudWatch</text>

  <!-- Alerts -->
  <path d="M270 215 L224 215" stroke="#c2410c" stroke-width="2" fill="none" marker-end="url(#alert)"/>
  <rect class="box" x="20" y="120" width="200" height="190" rx="12"/>
  <text x="38" y="148" class="h">Your team</text>
  <g class="s">
    <text x="38" y="178">Email (any SMTP)</text>
    <text x="38" y="204">Slack</text>
    <text x="38" y="230">Telegram</text>
    <text x="38" y="256">WhatsApp</text>
    <text x="38" y="282">Webhook</text>
  </g>

  <!-- Legend -->
  <g>
    <path d="M700 408 L740 408" stroke="#1c8f4e" stroke-width="2" marker-end="url(#probe)"/>
    <text x="750" y="412" class="s">probed from inside the VPC</text>
    <path d="M700 430 L740 430" stroke="#3a5bd9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#api)"/>
    <text x="750" y="434" class="s">read from the AWS API</text>
    <path d="M700 452 L740 452" stroke="#c2410c" stroke-width="2" marker-end="url(#alert)"/>
    <text x="750" y="456" class="s">alerts, one per resource</text>
  </g>
</svg>
